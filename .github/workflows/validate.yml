name: Validate Python source and persistence

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD

  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telegrambot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telegrambot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/telegrambot_test
      API_TOKEN: 123456789:TEST_TOKEN
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal smoke-test dependencies
        run: python -m pip install --disable-pip-version-check sqlalchemy psycopg2-binary pyTelegramBotAPI
      - name: Exercise persistence, atomic purchase, payment idempotency, and backup restore
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          import database

          database.init_db()
          uid = "900000001"
          database.register_user(SimpleNamespace(id=int(uid), username="smoke", first_name="Smoke"))
          database.update_user_data(uid, points=100)

          database.keys_store.clear()
          database.keys_store.update({"smoke-product": {"basic": ["SMOKE-KEY-1"]}})
          database.bot_config["star_to_points_rate"] = 2
          database.bot_config["vip_price_stars"] = 100
          database.save_json(database.DB_KEYS, database.keys_store)
          database.save_json(database.DB_CONFIG, database.bot_config)

          key, stock, balance = database.purchase_key_atomic(
              uid, "smoke-product", "basic", 10, username="smoke"
          )
          assert key == "SMOKE-KEY-1" and stock == 0 and balance == 90
          assert database.get_user(uid)["points"] == 90

          payload = f"stars_convert_{uid}_2_4"
          first = database.process_stars_payment_atomic(uid, payload, 2, "smoke-charge-1")
          assert not first["duplicate"] and first["points"] == 4
          assert database.get_user(uid)["points"] == 94
          second = database.process_stars_payment_atomic(uid, payload, 2, "smoke-charge-1")
          assert second["duplicate"]
          assert database.get_user(uid)["points"] == 94

          backup = database.export_full_backup()
          assert backup["format"] == "telegram_bot_full_backup"
          assert backup["users_table"]["rows"]
          with database.engine.begin() as conn:
              conn.execute(database.text("DELETE FROM users"))
              conn.execute(database.text("DELETE FROM bot_state"))
              conn.execute(database.text("DELETE FROM bot_processed_star_payments"))

          restored = database.restore_full_backup(backup)
          assert restored["users"] == 1
          assert database.get_user(uid)["points"] == 94
          assert database.keys_store["smoke-product"]["basic"] == []
          duplicate_after_restore = database.process_stars_payment_atomic(
              uid, payload, 2, "smoke-charge-1"
          )
          assert duplicate_after_restore["duplicate"]
          assert database.get_user(uid)["points"] == 94
          print("PostgreSQL persistence smoke test passed.")
          PY
